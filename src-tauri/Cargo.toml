[package]
name = "padlab"
version = "0.1.0"
description = "PadLab: status e teste do controle DualSense"
authors = ["Daniel Bernardes"]
edition = "2021"

[lib]
name = "padlab_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
